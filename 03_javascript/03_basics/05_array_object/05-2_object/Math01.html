<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math</title>
</head>

<body>
    <script>
        let num = 2.1234;
        let maxNum = Math.max(10, 5, 8, 30); //최대값 추출
        console.log(maxNum);
        let minNum = Math.min(10, 5, 8, 30); //최소값 추출
        console.log(minNum);
        let roundNum = Math.round(num); //소수점 첫째짜리 반올림
        console.log(roundNum);
        let floorNum = Math.floor(num); //소수점 첫째자리 내림
        console.log(floorNum);
        let ceilNum = Math.ceil(num); //소수점 첫째자리 올림
        console.log(ceilNum);
        let piNum = Math.PI; //원주율 상수 반환
        console.log(piNum);
        let rNum = Math.random(); // 0~1 사이에 난수 발생
        console.log(rNum);
        let rNum2 = Math.random() * 10; //0~10사이의 난수 발생
        console.log(rNum2);
        let rNum3 = Math.floor(rNum2); //0~9 까지 정수
        console.log(rNum3);

    </script>
</body>

</html>
