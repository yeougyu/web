<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연습</title>
</head>

<body>
    <main class="n_case">
        <h1>네이버</h1>
        <a href="https://www.naver.com/" target="blank">네이버</a>
        <a href="https://www.naver.com/"><img src="../06img/images/네이버.jpg" alt="네이버"></a>
        <section>
            <h2>검색</h2>
            <section class="card search_card">
                <form method="get" class="search_form">
                    <label for="search" class="blind">검색어 입력</label>
                    <input type="search" id="search" placeholder="검색어를 입력하세요"><!-- 검색 필드 : 검색창에 x 표시가 되어 검색어 삭제가 쉬움 -->
                    <button type="submit">
                        <span class="icon_mdi_search" aria-hidden="true"></span><!-- aria-hidden 돋보기 모양 검색버튼 -->
                    </button>
                </form>
            </section>
            </form>
        </section>
        <form>
            <fieldset>
                <legend>로그인</legend>
                <div class="form_group">
                    <label>
                        아이디 <input type="text" placeholder="아이디입력를 입력하세요." value="" size="20">
                    </label>
                </div>
                <div>
                    <label>
                        비밀번호 <input type="password" placeholder="비밀번호를 입력하세요.">
                    </label>
                </div>
            </fieldset>
            <fieldset>
                <legend>회원가입</legend>
                <div>
                    <label for="m_name">이름 : </label>
                    <input type="text" id="m_name">
                </div>
            </fieldset>
        </form>
    </main>
</body>

</html>
