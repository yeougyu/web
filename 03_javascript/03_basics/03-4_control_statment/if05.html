<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>else if문</title>
</head>

<body>
    <script>
        const mon = Number(prompt('좋아하는 월을 숫자로 입력하세요'));
        if (mon >= 9 && mon <= 11) {
            document.write('가을');
        } else if (mon >= 6 && mon <= 8) {
            document.write('여름');
        }  else if (mon >= 3 && mon <= 5) {
            document.write('봄');
        }  else if (mon >= 12 && mon <= 2) {
            document.write('겨울');
        }   else {
            document.write('다시 입력해주세요.');
        }
    </script>
</body>

</html>
