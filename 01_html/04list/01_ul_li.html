<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>순서가 없는 목록</title>
  <style>
    ul {
      list-style: decimal;
    }

    ol {
      list-style: disc;
    }
  </style>
</head>

<body>
  <ul>
    <li>사과</li>
    <li>바나나</li>
    <li>샤인머스켓</li>
    <li>배</li>
  </ul>
  <ol>
    <li>사과</li>
    <li>바나나</li>
    <li>샤인머스켓</li>
    <li>배</li>
  </ol>
</body>

</html>
