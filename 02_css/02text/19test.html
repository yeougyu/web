<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>목록 스타일</title>
    <style>
        h1 {
            width: 80px;
            margin: 0 auto ;
            border: 1px solid #000;

            background-color: aqua;
            line-height: 40px;
            

        }
    
        * {
            margin: 0;
            padding: 0;
        }
        ul,
        ol {
            width: 700px;
            margin: 0 auto;
            border: 1px solid #ccc;
        }

        .menu1 {

        }

        ul {
            list-style-type: none;
            list-style: decimal-leading-zero inside;
        }

        ol {
            list-style-position: inside;
            list-style: disc;
        }

        .img_ul {
            list-style-image: url(./fluent_home-12-filled.jpg);
            list-style: url(./fluent_home-12-filled.jpg) outside;
        }

        .check_list {
            list-style-type: 'v';
        }
    </style>
</head>
    <h1>내려가라</h1>

</html>
